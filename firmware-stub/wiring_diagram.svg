<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%" style="background-color: #0C141B; font-family: monospace;">
  <!-- Title & Frame -->
  <rect x="10" y="10" width="880" height="580" rx="8" fill="#131E28" stroke="#1F6B75" stroke-width="2"/>
  <text x="30" y="45" fill="#E6E1D5" font-size="20" font-weight="bold">FLOODSENSE HARDWARE NODE WIRING SCHEMATIC</text>
  <text x="30" y="65" fill="#2B8C98" font-size="12">FOSSEE Open Hardware National Make-A-Thon 2026 Blueprint</text>
  <text x="680" y="45" fill="#D97706" font-size="12" font-weight="bold">PLANNED HARDWARE - NOT BUILT THIS ROUND</text>

  <!-- ESP32 Microcontroller -->
  <g transform="translate(330, 200)">
    <rect x="0" y="0" width="240" height="260" rx="6" fill="#1A2A3A" stroke="#2B8C98" stroke-width="2"/>
    <rect x="20" y="10" width="200" height="30" fill="#0C141B" rx="4"/>
    <text x="120" y="30" fill="#E6E1D5" font-size="14" font-weight="bold" text-anchor="middle">ESP32 DevKit V1</text>
    
    <!-- Left Pins -->
    <text x="10" y="70" fill="#A0AEC0" font-size="10">VIN (+5V)</text>
    <text x="10" y="100" fill="#A0AEC0" font-size="10">GND</text>
    <text x="10" y="130" fill="#A0AEC0" font-size="10">GPIO 5 (TRIG)</text>
    <text x="10" y="160" fill="#A0AEC0" font-size="10">GPIO 18 (ECHO)</text>
    <text x="10" y="190" fill="#A0AEC0" font-size="10">GPIO 19 (RAIN)</text>
    <text x="10" y="220" fill="#A0AEC0" font-size="10">GPIO 34 (BAT ADC)</text>

    <!-- Wi-Fi Antenna Icon -->
    <path d="M 210 230 A 15 15 0 0 0 230 210 M 215 230 A 10 10 0 0 0 225 220" fill="none" stroke="#2B8C98" stroke-width="2"/>
    <circle cx="210" cy="230" r="3" fill="#2B8C98"/>
  </g>

  <!-- Sensor 1: JSN-SR04T Waterproof Ultrasonic -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="200" height="120" rx="6" fill="#162330" stroke="#1F6B75" stroke-width="1.5"/>
    <text x="100" y="25" fill="#E6E1D5" font-size="12" font-weight="bold" text-anchor="middle">JSN-SR04T Ultrasonic Sensor</text>
    <circle cx="50" cy="70" r="25" fill="#0C141B" stroke="#2B8C98" stroke-width="2"/>
    <circle cx="150" cy="70" r="25" fill="#0C141B" stroke="#2B8C98" stroke-width="2"/>
    <text x="50" y="74" fill="#A0AEC0" font-size="9" text-anchor="middle">TRANSMIT</text>
    <text x="150" y="74" fill="#A0AEC0" font-size="9" text-anchor="middle">RECEIVE</text>
  </g>

  <!-- Sensor 2: Tipping Bucket Rain Gauge -->
  <g transform="translate(40, 320)">
    <rect x="0" y="0" width="200" height="110" rx="6" fill="#162330" stroke="#1F6B75" stroke-width="1.5"/>
    <text x="100" y="25" fill="#E6E1D5" font-size="12" font-weight="bold" text-anchor="middle">Rain Gauge (Reed Switch)</text>
    <path d="M 70 80 L 100 45 L 130 80 Z" fill="#0C141B" stroke="#D97706" stroke-width="2"/>
    <text x="100" y="100" fill="#A0AEC0" font-size="10" text-anchor="middle">0.2794 mm / tip</text>
  </g>

  <!-- Power Module: Solar Panel + TP4056 + Battery -->
  <g transform="translate(640, 150)">
    <rect x="0" y="0" width="220" height="280" rx="6" fill="#162330" stroke="#D97706" stroke-width="1.5"/>
    <text x="110" y="25" fill="#E6E1D5" font-size="12" font-weight="bold" text-anchor="middle">Solar Power Supply</text>
    
    <!-- Solar Panel -->
    <rect x="30" y="45" width="160" height="60" fill="#0A1826" stroke="#D97706" stroke-width="1"/>
    <line x1="70" y1="45" x2="70" y2="105" stroke="#1F6B75"/>
    <line x1="110" y1="45" x2="110" y2="105" stroke="#1F6B75"/>
    <line x1="150" y1="45" x2="150" y2="105" stroke="#1F6B75"/>
    <text x="110" y="80" fill="#D97706" font-size="11" text-anchor="middle">6V / 5W Solar Panel</text>

    <!-- TP4056 Charge Controller -->
    <rect x="40" y="135" width="140" height="50" fill="#1A2A3A" stroke="#2B8C98" stroke-width="1"/>
    <text x="110" y="165" fill="#E6E1D5" font-size="11" text-anchor="middle">TP4056 Charger + Boost</text>

    <!-- Battery -->
    <rect x="40" y="210" width="140" height="45" fill="#2E7D32" rx="4"/>
    <text x="110" y="237" fill="#FFFFFF" font-size="11" text-anchor="middle">18650 LiFePO4 (3.7V 3400mAh)</text>
  </g>

  <!-- Wiring Connections -->
  <!-- Ultrasonic to ESP32 -->
  <path d="M 240 160 L 330 260" fill="none" stroke="#2E7D32" stroke-width="2" stroke-dasharray="4,4"/> <!-- VCC/GND -->
  <path d="M 240 180 L 330 330" fill="none" stroke="#2B8C98" stroke-width="2"/> <!-- TRIG to GPIO 5 -->
  <path d="M 240 200 L 330 360" fill="none" stroke="#D97706" stroke-width="2"/> <!-- ECHO to GPIO 18 -->

  <!-- Rain Gauge to ESP32 -->
  <path d="M 240 370 L 330 390" fill="none" stroke="#DC2626" stroke-width="2"/> <!-- Rain to GPIO 19 -->

  <!-- Power to ESP32 -->
  <path d="M 640 280 L 570 270" fill="none" stroke="#DC2626" stroke-width="2.5"/> <!-- 5V VIN -->
  <path d="M 640 300 L 570 300" fill="none" stroke="#A0AEC0" stroke-width="2.5"/> <!-- GND -->

  <!-- Legend -->
  <g transform="translate(30, 500)">
    <rect x="0" y="0" width="840" height="60" fill="#162330" rx="4" stroke="#1F6B75"/>
    <text x="20" y="35" fill="#E6E1D5" font-size="11" font-weight="bold">LEGEND:</text>
    <line x1="90" y1="30" x2="140" y2="30" stroke="#DC2626" stroke-width="3"/>
    <text x="150" y="35" fill="#A0AEC0" font-size="11">Power (+5V / GPIO Interrupt)</text>
    
    <line x1="360" y1="30" x2="410" y2="30" stroke="#2B8C98" stroke-width="3"/>
    <text x="420" y="35" fill="#A0AEC0" font-size="11">Ultrasonic Trigger/Echo</text>

    <line x1="610" y1="30" x2="660" y2="30" stroke="#D97706" stroke-width="3"/>
    <text x="670" y="35" fill="#A0AEC0" font-size="11">Rainfall Pulse Count</text>
  </g>
</svg>
